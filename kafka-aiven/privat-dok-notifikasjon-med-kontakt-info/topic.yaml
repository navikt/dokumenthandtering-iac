apiVersion: kafka.nais.io/v1
kind: Topic
metadata:
  name: privat-dok-notifikasjon-med-kontakt-info
  namespace: teamdokumenthandtering
  labels:
    team: teamdokumenthandtering
spec:
  pool: {{pool}}
  config:
  {{#each config as |value key|}}
     {{key}}: {{value}}
  {{/each}}
  acl:
    - team: teamdokumenthandtering
      application: doknotifikasjon-2
      access: readwrite
    - team: teamsykmelding
      application: narmesteleder-varsel
      access: write
    - team: flex
      application: sykepengesoknad-narmesteleder-varsler
      access: write
    - team: flex
      application: syfovarsel
      access: write
    - team: teamdokumenthandtering
      application: varsel2
      access: write
