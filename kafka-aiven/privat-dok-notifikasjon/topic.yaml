apiVersion: kafka.nais.io/v1
kind: Topic
metadata:
  name: privat-dok-notifikasjon
  namespace: teamdokumenthandtering
  labels:
    team: teamdokumenthandtering
spec:
  pool: {{pool}}
  config:
  {{#each config as |value key|}}
     {{key}}: {{value}}
  {{/each}}
  acl:
    - team: teamdokumenthandtering
      application: doknotifikasjon-2
      access: readwrite
    - team: min-side
      application: dittnav-varselbestiller
      access: write
    - team: teamdokumenthandtering
      application: varsel2
      access: write
    - team: teamdokumenthandtering
      application: naisclioffset
      access: read
    - team: min-side
      application: tms-ekstern-varselbestiller
      access: write
    - team: min-side
      application: tms-ekstern-varsling
      access: write
