apiVersion: kafka.nais.io/v1
kind: Topic
metadata:
  name: privat-altinn-melding-hendelse
  namespace: teamdokumenthandtering
  labels:
    team: teamdokumenthandtering
spec:
  pool: {{pool}}
  config:
  {{#each config as |value key|}}
    {{key}}: {{value}}
  {{/each}}
  acl:
    - team: teamdokumenthandtering
      application: dokdigdirhendelser
      access: write
    - team: teamdokumenthandtering
      application: dokdistdpv
      access: read