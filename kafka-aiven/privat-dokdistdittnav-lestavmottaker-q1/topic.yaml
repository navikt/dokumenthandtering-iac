apiVersion: kafka.nais.io/v1
kind: Topic
metadata:
  name: privat-dokdistdittnav-lestavmottaker-q1
  namespace: teamdokumenthandtering
  labels:
    team: teamdokumenthandtering
spec:
  pool: {{pool}}
  config:
  {{#each config as |value key|}}
     {{key}}: {{value}}
  {{/each}}
  acl:
    - team: teamdokumenthandtering
      application: safselvbetjening-q1
      access: write
    - team: teamdokumenthandtering
      application: dokdistdittnav
      access: read